# nginx.conf — Configuração do servidor de produção do frontend
#
# Serve os arquivos estáticos do React e, para rotas de SPA
# (ex: /channels, /call), redireciona para o index.html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Arquivos estáticos (index.html, assets, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets versionados
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Compressão gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
