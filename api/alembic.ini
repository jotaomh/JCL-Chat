# alembic.ini — Configuração do Alembic (migrações de banco)
#
# A URL de conexão NÃO fica aqui hardcoded: é lida do settings.py
# (que por sua vez vem das variáveis de ambiente). Veja alembic/env.py.
[alembic]
script_location = alembic
prepend_sys_path = .
# A url de conexão é definida em alembic/env.py (settings.database_url)
sqlalchemy.url =

# Impressão/log das migrações
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
